[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "captor"
version = "1.0.0"
description = "Text-encoder-free grounding by counting caption co-occurrence over a frozen image encoder's visual words"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elad Yoshai" }, { name = "Natan T. Shaked" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "pillow>=10.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "huggingface_hub>=0.23",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
pathology = ["timm>=0.9.16", "transformers>=4.40"]
eval = ["pycocotools>=2.0.7"]
demo = ["gradio>=4.40"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["captor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
